services:
  - type: web
    name: desk
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: desk-db
          property: connectionString
      - key: BASE_RATE_INR
        value: "88.00"
      - key: SPREAD_PERCENT
        value: "1.5"
      - key: WALLET_ENCRYPTION_KEY
        generateValue: true
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBER
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TATUM_API_KEY
        sync: false
      - key: BSCSCAN_API_KEY
        sync: false
      - key: NODE_ENV
        value: "production"
      - key: SEED_USER_EMAIL
        value: "user@desk.test"
      - key: SEED_USER_PASSWORD
        value: "testuser123"
      - key: SEED_ADMIN_EMAIL
        value: "admin@desk.test"
      - key: SEED_ADMIN_PASSWORD
        value: "testadmin123"

databases:
  - name: desk-db
    plan: free